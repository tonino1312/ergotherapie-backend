spring:
  application:
    name: proyecto-elena
  profiles:
    active: dev

app:
  jwt:
    expiration-ms: 86400000 # 24h
  google:
    # Client ID de OAuth 2.0 de Google Cloud Console. Vacío por defecto:
    # mientras no se configure, el login con Google siempre rechaza el token
    # (audiencia nunca coincide con cadena vacía) en vez de fallar de forma insegura.
    client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    from: ${MAIL_FROM:no-reply@ergotherapie.local}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/proyecto_elena
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  mail:
    # Mailpit (docker-compose): servidor SMTP falso para dev, sin auth ni TLS.
    # Interfaz web para ver los correos enviados: http://localhost:8025
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  jwt:
    # Solo para desarrollo local. En producción SIEMPRE se define vía variable de entorno JWT_SECRET.
    secret: ${JWT_SECRET:desarrollo-local-secreto-no-usar-en-produccion-cambiar-siempre-32b}

logging:
  level:
    com.elena.proyectoelena: DEBUG
  file:
    name: logs/proyecto-elena.log

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
  mail:
    from: ${MAIL_FROM}

logging:
  level:
    com.elena.proyectoelena: INFO
