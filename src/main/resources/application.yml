spring:
  application:
    name: proyecto-elena
  profiles:
    active: dev

app:
  jwt:
    expiration-ms: 86400000 # 24h

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/proyecto_elena
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

app:
  jwt:
    # Solo para desarrollo local. En producción SIEMPRE se define vía variable de entorno JWT_SECRET.
    secret: ${JWT_SECRET:desarrollo-local-secreto-no-usar-en-produccion-cambiar-siempre-32b}

logging:
  level:
    com.elena.proyectoelena: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    com.elena.proyectoelena: INFO
